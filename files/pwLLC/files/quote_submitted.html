
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | Property Works LLC</title>

  <link rel="icon" type="image/png" href="../images/favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #3B9ABF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .thank-you-container {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 55px 35px;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(38, 56, 63, 0.15);
    }

    .checkmark {
      width: 75px;
      height: 75px;
      margin: 0 auto 25px;
      background: #3B9ABF;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
    }

    h1 {
      color: #26383f;
      font-size: clamp(2rem, 5vw, 2.7rem);
      margin-bottom: 18px;
    }

    p {
      color: #65757b;
      font-size: 1.05rem;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .home-button {
      display: inline-block;
      background: #BF7C2A;
      color: #ffffff;
      padding: 15px 28px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.2s ease,
                  transform 0.2s ease;
    }

    .home-button:hover {
      background: #3B9ABF;
      transform: translateY(-2px);
    }

    .brand-name {
      margin-top: 30px;
      color: #3B9ABF;
      font-weight: bold;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <main class="thank-you-container">

    <div class="checkmark" aria-hidden="true">
      ✓
    </div>

    <h1>Thank You!</h1>

    <p>
      Your request has been submitted successfully.
      We appreciate your interest in our cleaning services
      and will get back to you as soon as possible.
    </p>

    <a href="index.html" class="home-button">
      Back to Home
    </a>

    <div class="brand-name">
      Property Works Services LLC
    </div>

  </main>
</body>
</html>
